<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="remoteman マスコット「リモまん」">
  <!-- アンテナ(遠隔通信を表す信号) -->
  <line x1="120" y1="46" x2="120" y2="24" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="18" r="7" fill="#3b82f6"/>
  <circle cx="120" cy="18" r="7" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="7;15;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 頭部(ターミナル画面の顔) -->
  <rect x="65" y="50" width="110" height="78" rx="18" fill="#12151c" stroke="#3b82f6" stroke-width="4"/>
  <!-- ウィンドウ操作ドット -->
  <circle cx="82" cy="66" r="4" fill="#ef4444"/>
  <circle cx="96" cy="66" r="4" fill="#f59e0b"/>
  <circle cx="110" cy="66" r="4" fill="#22c55e"/>
  <!-- プロンプト表示(顔) -->
  <text x="84" y="108" font-family="Menlo, Consolas, 'SF Mono', monospace" font-size="30" fill="#4ade80" font-weight="700">&gt;</text>
  <rect x="120" y="84" width="14" height="24" fill="#4ade80">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.4;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- 首 -->
  <rect x="112" y="126" width="16" height="10" fill="#2a2f3a"/>

  <!-- 胴体 -->
  <rect x="50" y="134" width="140" height="86" rx="22" fill="#1f232c" stroke="#2a2f3a" stroke-width="3"/>

  <!-- 胸のSSH接続ポート -->
  <circle cx="120" cy="177" r="19" fill="#0d0f14" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="120" cy="177" r="7" fill="#3b82f6"/>
  <line x1="120" y1="164" x2="120" y2="158" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="108" y1="169" x2="103" y2="164" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="169" x2="137" y2="164" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

  <!-- 左腕 -->
  <rect x="18" y="148" width="34" height="15" rx="7.5" fill="#1f232c" stroke="#2a2f3a" stroke-width="3" transform="rotate(-16 35 155)"/>
  <circle cx="20" cy="145" r="9" fill="#1f232c" stroke="#2a2f3a" stroke-width="3"/>

  <!-- 右腕(SSHケーブルを持っている) -->
  <rect x="188" y="148" width="34" height="15" rx="7.5" fill="#1f232c" stroke="#2a2f3a" stroke-width="3" transform="rotate(16 205 155)"/>
  <circle cx="220" cy="145" r="9" fill="#1f232c" stroke="#2a2f3a" stroke-width="3"/>

  <!-- ケーブル(接続を表す) -->
  <path d="M 220 145 C 236 160, 232 190, 210 200" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10"/>
  <rect x="196" y="196" width="22" height="14" rx="3" fill="#3b82f6"/>
  <rect x="200" y="209" width="4" height="6" fill="#3b82f6"/>
  <rect x="210" y="209" width="4" height="6" fill="#3b82f6"/>

  <!-- 足 -->
  <rect x="72" y="216" width="20" height="22" rx="6" fill="#1f232c" stroke="#2a2f3a" stroke-width="3"/>
  <rect x="148" y="216" width="20" height="22" rx="6" fill="#1f232c" stroke="#2a2f3a" stroke-width="3"/>
</svg>
